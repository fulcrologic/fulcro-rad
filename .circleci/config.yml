version: 2.1
orbs:
  browser-tools: circleci/browser-tools@2.4.2
jobs:
  cljs:
    docker:
      - image: cimg/clojure:1.12.6-openjdk-21.0-browsers
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - checkout
      - browser-tools/install_browser_tools
      - run:
          name: Enable pnpm
          command: |
            node --version
            mkdir -p ~/bin
            corepack enable --install-directory ~/bin
            pnpm --version
            pnpm store path
      - restore_cache:
          key: cljs-{{ checksum "deps.edn" }}-{{ checksum "pnpm-lock.yaml" }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec shadow-cljs -v compile ci-tests
      - run: pnpm exec karma start --single-run
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
            - ~/.m2
          key: cljs-{{ checksum "deps.edn" }}-{{ checksum "pnpm-lock.yaml" }}
  clj:
    docker:
      - image: cimg/clojure:1.12.0-openjdk-21.0-browsers
    steps:
      - checkout
      - restore_cache:
          key: clj-{{ checksum "deps.edn" }}
      - run: clojure -A:dev:tests:clj-tests
      - save_cache:
          paths:
            - ~/.m2
          key: clj-{{ checksum "deps.edn" }}
workflows:
  version: 2
  fullstack:
    jobs:
      - clj
      - cljs
